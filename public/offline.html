<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0e1012" />
    <title>FireLine · offline</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #0e1012;
        color: #eef0f2;
        font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      main {
        max-width: 420px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 600;
        font-size: 19px;
        margin-bottom: 28px;
      }
      .red {
        color: #ff5a4a;
      }
      .grey {
        color: #c4cbd1;
      }
      h1 {
        font-size: 24px;
        line-height: 1.25;
        margin: 0 0 10px;
      }
      p {
        margin: 0 0 8px;
        color: #c4cbd1;
      }
      button {
        margin-top: 20px;
        min-height: 44px;
        padding: 0 22px;
        border: 0;
        border-radius: 999px;
        background: #ef5a2a;
        color: #1a0803;
        font: 600 15px system-ui, sans-serif;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">
        <img src="/brand/fireline-mark.svg" width="28" height="28" alt="" />
        <span><span class="red">Fire</span><span class="grey">Line</span></span>
      </div>
      <h1 id="t">No internet connection</h1>
      <p id="p1">FireLine needs a connection to load the latest hotspots.</p>
      <p id="p2">A field report that could not be sent is kept on this phone. Open the same link again once you are back online to send it.</p>
      <button type="button" id="b" onclick="location.reload()">Try again</button>
    </main>
    <script>
      // same language as the app (fireline.lang), Indonesian when the phone is set to it
      try {
        var l = localStorage.getItem("fireline.lang") || (navigator.language || "").slice(0, 2);
        if (l === "id") {
          document.documentElement.lang = "id";
          document.getElementById("t").textContent = "Tidak ada koneksi internet";
          document.getElementById("p1").textContent = "FireLine perlu koneksi untuk memuat titik panas terbaru.";
          document.getElementById("p2").textContent = "Laporan lapangan yang gagal terkirim tetap tersimpan di HP ini. Buka lagi tautan yang sama begitu koneksi kembali untuk mengirimnya.";
          document.getElementById("b").textContent = "Coba lagi";
        }
      } catch (e) {}
    </script>
  </body>
</html>
